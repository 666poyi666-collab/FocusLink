appId: com.focuslink.app
productName: FocusLink
directories:
  # 必须是去点的 `release-v136` 形式（仓库约定：0.2.10 → release-v0210）。
  # 曾试过写 `../release-v${version}` 想让它自动跟随 package.json——**不行**：
  # electron-builder 的 ${version} 就是 package.json 的字面量，会展开成
  # `release-v1.3.6`（带点），与 gen-version.js 的 `release-v${version.replace(/\./g,'')}`
  # 以及仓库「只保留最新三个 release-v*」的约定都不一致。
  # 因此这里与 shared/version.ts 的 APP_RELEASE_DIR 一样是**手工同步点**：
  # 升版本时必须同时改这两处，并确认 `npm run dist:win` 的 appOutDir 落在正确目录。
  output: ../release-v174
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!**/*.{map,ts}'
  # 不要在安装包里携带 Capacitor 的 Gradle 构建产物。
  # 实测（2026-09-11）已安装的 1.3.4/1.3.5：`resources/app.asar.unpacked/node_modules/@capacitor`
  # 下有 186 个位于 `build/` 之下的文件（Gradle 的 .transforms、intermediates、outputs、tmp），
  # 是 `npx cap sync` 的生成物，可再生、运行期完全用不到；深层嵌套路径还会踩到
  # Windows 260 字符上限（清理这些中间产物时实测报 PathTooLong）。
  # 用 `@capacitor/**/build/**` 一条覆盖全部形态——该模式经**磁盘真实路径**回测：
  # 命中 186/186 需排除文件，误伤 0/68 必保留文件。
  # 两点必须守住：① 前缀必须限定在 `@capacitor/` 命名空间内，否则会连
  # better-sqlite3 的 `build/Release/*.node` 一起误伤（那是运行期必需的原生模块）；
  # ② 不要按 `*/android/build` 之类的层数去写，实测层级不统一（app 与 android 两包的
  # 嵌套深度不同），按层数写必然漏。
  - '!**/node_modules/@capacitor/**/build/**'
  # v1.6.7 包体瘦身（一）：@fontsource 原包永不进包。
  # 实测 node_modules/@fontsource + @fontsource-variable 共 7 个包、70.74 MiB；
  # 而构建产物 dist/assets 里已经有一份被 Vite 哈希过的 woff2 副本。
  # 运行期没有任何代码 require 这些包，它们只在构建期被 CSS @import 读取。
  - '!**/node_modules/@fontsource/**'
  - '!**/node_modules/@fontsource-variable/**'
  # v1.6.7 包体瘦身（二）：better-sqlite3 只留 Windows x64 的 N-API prebuild。
  # 实测 prebuilds 下 8 个平台文件合计 16.11 MiB，win32-x64.node 只有 1.90 MiB；
  # deps/ 的 9.78 MiB 是 sqlite3 C 源码，npmRebuild:false 时打包期不需要。
  # lib/win32-x64.js 只 require ../prebuilds/win32-x64.node，其余平台文件永不加载。
  - '!**/node_modules/better-sqlite3/prebuilds/darwin-*'
  - '!**/node_modules/better-sqlite3/prebuilds/linux*'
  - '!**/node_modules/better-sqlite3/prebuilds/win32-arm64.node'
  - '!**/node_modules/better-sqlite3/deps/**'
  # v1.6.7 包体瘦身（三）：renderer 专用依赖已由 Vite 打进 dist/assets，主进程不 require
  # 它们（vite.config.ts:29 的 external 只有 better-sqlite3 / ws / undici）。
  - '!**/node_modules/lucide-react/**'
  - '!**/node_modules/framer-motion/**'
  - '!**/node_modules/motion-dom/**'
  - '!**/node_modules/motion-utils/**'
  - '!**/node_modules/zustand/**'
  - '!**/node_modules/use-sync-external-store/**'
asar: true
# v1.6.7 实测结论（2026-10-20）：electron-builder 26.15.3 打包时会打开该 fuse 并写入 asar 完整性
# 资源，而本机产物里该资源与实际 app.asar 不匹配，Electron 启动时 C++ CHECK 失败，进程以
# 0x80000003(STATUS_BREAKPOINT) 立即退出：无窗口、无日志、user-data-dir 里连 Chromium profile
# 都不建（人工排查花了 40 分钟）。三条互证：① 裸 node_modules/electron/dist/electron.exe 配同一份
# app.asar 启动全绿；② 只把 exe 换成安装版 1.6.5 的 FocusLink.exe，同一份内容也全绿；③ 用
# @electron/fuses 关掉已打包 exe 的 EnableEmbeddedAsarIntegrityValidation 后立刻全绿。
# 2026-10-20 结论修正：打包产物「启动即崩」与 asar 完整性、exe 编辑、排除项全部无关。
# 同一份产物（文件树 76 项零差异、exe 逐字节相同）在
#   C:\Users\<user>\Desktop\开发\...\release-v167\win-unpacked  → 必崩（0x80000003，四连复现）
#   C:\fltest\win-unpacked、Desktop\foucslink-copy、Desktop\测试目录、%TEMP%        → 全绿
# 所以是「打包产物从本仓库那条长中文路径直接拉起」的环境效应（安装器在该路径下静默退出 0 也是同一现象）。
# 验收/门禁一律把产物复制到短 ASCII 路径再拉起；安装走安装器本身，落在 %LOCALAPPDATA% 不受影响。
# better-sqlite3 13 ships N-API prebuilds. Rebuilding its compatibility binding with node-gyp
# would incorrectly require a local MSVC toolchain and would throw away the cross-runtime benefit.
npmRebuild: false
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/bindings/**"
  - "**/node_modules/file-uri-to-path/**"
extraResources:
  - from: build/
    to: build/
    filter: ["**/*"]
publish: null
# v1.6.7 包体瘦身（四）：只保留中英文 locale。
# 实测 node_modules/electron/dist/locales 下 55 个 .pak 合计 46.65 MiB，
# 其中 zh-CN + en-US 只有 1.09 MiB，其余语言包在本产品运行期永不读取。
electronLanguages:
  - zh-CN
  - en-US
win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FocusLink
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
