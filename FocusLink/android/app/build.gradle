apply plugin: 'com.android.application'

def focuslinkApplicationId = project.findProperty('focuslinkApplicationId') ?: 'app.focuslink.mobile'

// 2026-09-10 签名稳定化：此前项目没有任何 signingConfig，installDebug 用的是一直在变的
// 本机自动生成 ~/.android/debug.keystore，换机器或删掉该文件就会换签名，导致
// INSTALL_FAILED_UPDATE_INCOMPATIBLE（同一产品无法覆盖安装）。现在改为统一使用随仓库携带的
// android/keystore/focuslink-release.jks，debug 与 release 都签这一把。
def focuslinkKeystorePropertiesFile = rootProject.file('keystore.properties')
def focuslinkKeystoreProperties = new Properties()
def focuslinkHasStableKeystore = focuslinkKeystorePropertiesFile.exists()
if (focuslinkHasStableKeystore) {
    focuslinkKeystorePropertiesFile.withInputStream { focuslinkKeystoreProperties.load(it) }
}

android {
    testOptions {
        unitTests.all {
            systemProperty 'focuslink.expectedApplicationId',
                project.findProperty('focuslinkExpectedApplicationId') ?: 'app.focuslink.mobile'
        }
    }
    namespace "app.focuslink.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        focuslinkStable {
            if (focuslinkHasStableKeystore) {
                storeFile rootProject.file(focuslinkKeystoreProperties['storeFile'])
                storePassword focuslinkKeystoreProperties['storePassword']
                keyAlias focuslinkKeystoreProperties['keyAlias']
                keyPassword focuslinkKeystoreProperties['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId focuslinkApplicationId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1315
        versionName "1.3.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "DEFAULT_SYNC_ENDPOINT", '""'
        buildConfigField "String", "CANONICAL_SYNC_ORIGIN", '"https://foxlink-mcp.focuslink-poyi-6465e9.workers.dev"'
        buildConfigField "String", "SYNC_FAILOVER_ORIGIN", '"https://focuslink.pyzzgk.dpdns.org"'
        manifestPlaceholders = [appScheme: "focuslink"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            if (focuslinkHasStableKeystore) {
                signingConfig signingConfigs.focuslinkStable
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (focuslinkHasStableKeystore) {
                signingConfig signingConfigs.focuslinkStable
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.work:work-runtime:2.10.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
