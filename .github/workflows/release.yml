name: Release record gate

# 2026-10-17（用户拍板：安装包永不进 Git，只作 GitHub Release 附件）：
# 这个 workflow 只做「发布记录 + 源码门禁」，不再重新 smoke 已提交的二进制、不再创建 Release。
# 正式发布（annotated tag、上传三个附件、回读核对）由本机在通过三设备安装门禁后执行：
#   pwsh -File FocusLink/scripts/release/publish.ps1 -Version x.y.z -NotesFile ... -Installer ... -Portable ... -Sha256File ...
# 理由：CI 拿不到本地安装验收结论，也不该被当成「允许发布」的授权。

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focuslink-release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify release record and source gates
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: FocusLink

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 发布二进制不再入库，因此不需要 LFS 拉取（历史 LFS 对象仍留在 Git 历史里）。
          lfs: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: FocusLink/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify release record
        shell: pwsh
        run: node scripts/release/verify-release-record.mjs

      - name: Verify source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run format:check
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm audit --omit=dev
